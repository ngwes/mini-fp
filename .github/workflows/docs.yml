name: Docs

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs-site/**
      - .github/workflows/docs.yml
  pull_request:
    branches: [main]
    paths:
      - README.md
      - docs-site/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests only build the site and check its links; main also deploys it
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm ci
        working-directory: docs-site
      - run: npm run build
        working-directory: docs-site
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs-site/.vitepress/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
